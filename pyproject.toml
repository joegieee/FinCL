[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincl"
version = "0.1.0"
description = "Local, evidence-backed personal finance ledger"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11,<1",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.scripts]
fincl = "fincl.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are tolerated in geometric parsing and SQL literals
    "SIM108", # explicit if/else is often clearer than a ternary here
    "B008",   # typer.Option(...) in argument defaults is the documented Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
