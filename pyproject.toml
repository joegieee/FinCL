[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincl"
version = "0.1.0"
description = "Local, evidence-backed personal finance ledger"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pdfplumber>=0.11,<1",
    "python-multipart>=0.0.20,<1",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
fincl = "fincl.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are tolerated in geometric parsing and SQL literals
    "SIM108", # explicit if/else is often clearer than a ternary here
    "B008",   # typer.Option(...) in argument defaults is the documented Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The demo generator is a deliberately dense single-file dev script, like the UI.
"scripts/create_demo.py" = ["E701", "E702"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
# A leaked SQLite connection under the ledger writer lock is a correctness bug,
# not a warning (PLAN-mvp.md §4); fail on it. The starlette/httpx TestClient
# deprecation noise is third-party and not ours to fix here.
filterwarnings = [
    "error::ResourceWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    "default",
]

[tool.setuptools.package-data]
fincl = ["static/*", "static/assets/*"]
